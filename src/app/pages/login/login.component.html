<div class="login-page d-flex">
  <!-- Lado esquerdo - Marca (oculto em dispositivos móveis) -->
  <app-brand-panel></app-brand-panel>

  <!-- Lado direito - Formulário de login (ocupa toda tela em mobile) -->
  <div
    class="col-12 col-md-6 d-flex align-items-center justify-content-center min-vh-100 px-3"
  >
    <div class="login-container w-100 px-3 px-md-0">
      <div class="card">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="user-avatar mx-auto mb-3">
              <i class="fas fa-user"></i>
            </div>
            <h3 class="card-title">Bem-vindo!</h3>
            <p class="text-muted">Faça login para acessar o painel</p>
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="fas fa-envelope"></i>
                </span>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  formControlName="email"
                  placeholder="Digite seu email"
                  [class.is-invalid]="email?.invalid && email?.touched"
                />
              </div>
              <div
                *ngIf="email?.invalid && email?.touched"
                class="invalid-feedback"
              >
                <div *ngIf="email?.errors?.['required']">
                  Email é obrigatório
                </div>
                <div *ngIf="email?.errors?.['email']">Email inválido</div>
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Senha</label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="fas fa-lock"></i>
                </span>
                <input
                  [type]="showPassword ? 'text' : 'password'"
                  class="form-control"
                  id="password"
                  formControlName="password"
                  placeholder="Digite sua senha"
                  [class.is-invalid]="password?.invalid && password?.touched"
                />
                <button
                  style="background-color: #6f7880; color: white"
                  type="button"
                  class="btn btn-outline-secondary"
                  (click)="togglePassword()"
                >
                  <i
                    [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"
                  ></i>
                </button>
              </div>
              <div
                *ngIf="password?.invalid && password?.touched"
                class="invalid-feedback"
              >
                <div *ngIf="password?.errors?.['required']">
                  Senha é obrigatória
                </div>
                <div *ngIf="password?.errors?.['minlength']">
                  Senha deve ter pelo menos 6 caracteres
                </div>
              </div>
            </div>

            <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
              {{ errorMessage }}
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100 mb-3 d-flex align-items-center justify-content-center"
              [disabled]="loginForm.invalid || isLoading"
            >
              <span *ngIf="isLoading" class="loading me-2"></span>
              <i *ngIf="!isLoading" class="fas fa-sign-in-alt me-2"></i>
              Entrar
            </button>
          </form>
        </div>
      </div>

      <!-- Footer -->
      <div class="text-center mt-3">
        <small class="text-muted">
          Criado por ©<a
            href="https://adftecnologia.com.br/"
            target="_blank"
            rel="noopener noreferrer"
            style="color: inherit; text-decoration: none"
            >AdF Tecnologia</a
          >
          {{ anoAtual }}
        </small>
      </div>
    </div>
  </div>
</div>
