<div class="dashboard-container">
  <div class="page-header mb-4">
    <h4 class="mb-0">
      <i class="fas fa-tachometer-alt me-2"></i>
      Visão geral
    </h4>
    <small class="text-muted"
      >Panorama dos tenants gerenciados pelo painel.</small
    >
  </div>

  <div class="row mb-4">
    <div class="col-md-6 mb-4">
      <div class="dashboard-card">
        <div class="d-flex gap-4 align-items-center mb-4">
          <div class="card-icon primary">
            <i class="fas fa-building"></i>
          </div>
          <div class="card-label">Tenants Cadastrados</div>
        </div>

        <app-skeleton
          *ngIf="carregando"
          width="60px"
          height="2rem"
          [shape]="'rounded'"
          [animation]="'wave'"
        ></app-skeleton>
        <div class="card-number" *ngIf="!carregando">
          {{ totalTenants ?? '—' }}
        </div>
      </div>
    </div>

    <div class="col-md-6 mb-4">
      <div class="dashboard-card">
        <div class="d-flex gap-4 align-items-center mb-4">
          <div class="card-icon success">
            <i class="fas fa-store"></i>
          </div>
          <div class="card-label">Mercado Pago Configurado</div>
        </div>

        <app-skeleton
          *ngIf="carregando"
          width="60px"
          height="2rem"
          [shape]="'rounded'"
          [animation]="'wave'"
        ></app-skeleton>
        <div class="card-number" *ngIf="!carregando">
          {{ totalMercadoPagoConfigurado ?? '—' }}
        </div>
      </div>
    </div>
  </div>
</div>
