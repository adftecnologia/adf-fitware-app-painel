name: 'Create Git Tag'
description: 'Create and push a new Git tag with the provided version'

on:
  workflow_call:
    inputs:
      version:
        description: 'The version to create as a Git tag'
        required: true
        type: string

permissions:
  contents: write # Para criar e push de tags

jobs:
  create-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || 'develop' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # Buscar todo histórico para verificar tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect branch and determine if should create tag
        id: detect-branch
        run: |
          CURRENT_BRANCH=$(git branch --show-current)
          echo "Branch atual: $CURRENT_BRANCH"

          if [[ $CURRENT_BRANCH == "master" || $CURRENT_BRANCH == "main" ]]; then
            echo "should-create-tag=true" >> $GITHUB_OUTPUT
            echo "🎯 Branch de produção detectada - Tag será criada"
          else
            echo "should-create-tag=false" >> $GITHUB_OUTPUT
            echo "🛠️ Branch de desenvolvimento - Tag NÃO será criada"
          fi

      - name: Update package.json version
        if: steps.detect-branch.outputs.should-create-tag == 'false'
        run: |
          VERSION=${{ inputs.version }}
          echo "📦 Atualizando package.json para versão: $VERSION"

          # Obter versão atual do package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Versão atual no package.json: $CURRENT_VERSION"

          # Usar npm version para atualizar o package.json
          npm version $VERSION --no-git-tag-version

          echo "✅ package.json atualizado com sucesso para versão $VERSION"

          # Verificar se houve mudança
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "Nova versão no package.json: $NEW_VERSION"

      - name: Commit package.json changes
        if: steps.detect-branch.outputs.should-create-tag == 'false'
        run: |
          VERSION=${{ inputs.version }}
          CURRENT_VERSION=$(git show HEAD~1:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version" 2>/dev/null || echo "unknown")

          echo "🔄 Criando commit com as mudanças do package.json na branch develop"

          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          # Verificar se há mudanças no package.json
          if git diff --quiet package.json; then
            echo "ℹ️ Nenhuma mudança detectada no package.json"
          else
            echo "📝 Adicionando mudanças do package.json ao commit"
            git add package.json
            git commit -m "chore: incremento de versão $CURRENT_VERSION -> $VERSION"
            
            echo "📤 Enviando commit para o repositório"
            git push origin HEAD
            
            echo "✅ Commit de atualização de versão criado e enviado com sucesso"
          fi

      - name: Create and push Git tag
        if: steps.detect-branch.outputs.should-create-tag == 'true'
        run: |
          VERSION=${{ inputs.version }}
          echo "🏷️ Creating Git tag for version: $VERSION"

          # Configurar git
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          # Verificar se a tag já existe no remoto
          if git ls-remote --tags origin | grep -q "refs/tags/v$VERSION$"; then
            echo "⚠️ Tag v$VERSION already exists on remote, skipping creation..."
            exit 0
          fi

          # Verificar se a tag existe localmente
          if git tag -l | grep -q "^v$VERSION$"; then
            echo "🗑️ Tag v$VERSION exists locally, removing it..."
            git tag -d "v$VERSION"
          fi

          # Criar e enviar a tag
          echo "🏷️ Creating tag v$VERSION..."
          git tag -a "v$VERSION" -m "🚀 Release version $VERSION - $(date '+%Y-%m-%d %H:%M:%S')"

          echo "📤 Pushing tag to remote..."
          git push origin "v$VERSION"

          echo "✅ Git tag v$VERSION created and pushed successfully"
