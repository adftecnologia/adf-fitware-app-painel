name: 'Merge to Environment Branch'
description: 'Merge release branches to their corresponding environment branches'

on:
  workflow_call:
    inputs:
      release-branch:
        description: 'Release branch that was merged'
        required: true
        type: string

permissions:
  contents: write

jobs:
  check-tag:
    name: '📜 Criação e verificação da nova tag e incremento de versão'
    uses: ./.github/workflows/04-check-tag.yaml
    secrets: inherit

  create-tag:
    name: '⚠️ Atualização de versão no package.json'
    # Executa se houve incremento de versão (MINOR/PATCH) ou se for criar tag (TAG)
    needs: [check-tag]
    if: needs.check-tag.outputs.version-type != 'NONE'
    uses: ./.github/workflows/05-create-new-tag.yaml
    with:
      version: ${{ needs.check-tag.outputs.new-version }}

    secrets: inherit

